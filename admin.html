
<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUTHU HUB - Admin Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      width: 85%;
      max-width: 350px;
      text-align: center;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #16a34a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login">
    <h2>MUTHU HUB</h2>
    <h3>Admin Login</h3>
    <form>
      <input
        type="password"
        placeholder="Admin Password"
        autocomplete="current-password"
        required
      >
      <button type="submit">Login</button>
    </form>
  </div>
  <script src="/admin.js" defer></script>
</body>
</html>
