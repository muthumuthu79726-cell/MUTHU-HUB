

<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUTHU HUB - Admin Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { color: #60a5fa; }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #dc2626;
      color: white;
      cursor: pointer;
    }
    .panel {
      margin-top: 25px;
      padding: 22px;
      background: #1e293b;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>MUTHU HUB Admin Panel</h1>
    <button id="logout">Logout</button>
  </header>

  <section class="panel">
    <h2>நிர்வாகப் பகுதி</h2>
    <p>வணக்கம்! MUTHU HUB Admin Panel-க்கு வரவேற்கிறோம்.</p>
    <p>இங்கே பதிவுகள் மற்றும் உள்ளடக்கங்களை நிர்வகிக்கும் வசதிகள் விரைவில் சேர்க்கப்படும்.</p>
  </section>

  <script>
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/logout");
      window.location.href = "/admin.html";
    });
  </script>
</body>
</html>
